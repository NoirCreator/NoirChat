<!DOCTYPE html>
<html>

<head>

    <title>NoirChat</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    <link rel="stylesheet" href="style.css">

</head>


<body>


<div class="chat-app">


    <!-- CHATS SCREEN -->

    <div id="chats-screen">


        <div class="header">

            <h1>NoirChat</h1>

            <button class="new-chat">
                +
            </button>

        </div>



        <div class="chats">


       <div class="chat" onclick="openChat('Alex')">

    <div class="avatar">
        A
    </div>

    <div class="chat-info">

        <h3>
    Alex
    <span class="online-dot"></span>
</h3>

        <p>
            Welcome to NoirChat
        </p>

    </div>

    <span class="time">
        12:45
    </span>
<span class="unread">
    2
</span>
</div>




            <div class="chat" onclick="openChat('Noir Team')">

    <div class="avatar">
        N
    </div>

    <div class="chat-info">

        <h3>Noir Team</h3>

        <p>
            Project updates
        </p>

    </div>

    <span class="time">
        09:20
    </span>
<span class="unread">
    5
</span>
</div>


    </div>





    <!-- MESSAGE SCREEN -->


    <div id="message-screen" class="hidden">


        <div class="chat-header">


            <button onclick="backToChats()">
                ←
            </button>


            <h2 id="chat-name">
                
            </h2>


        </div>



        <div id="messages">

        </div>



        <div class="send-box">


            <input 
            id="message-input"
            placeholder="Message">


            <button onclick="sendMessage()">

                ➤

            </button>


        </div>


    </div>





    <!-- CONTACTS -->


    <div id="contacts-screen" class="hidden">


        <h2>
            Contacts
        </h2>



        <div class="chat">


            <div class="avatar">
                M
            </div>


            <div>

                <h3>
                    Max
                </h3>

                <p>
                    Online
                </p>

            </div>


        </div>


    </div>





    <!-- PROFILE -->


    <div id="profile-screen" class="hidden">


        <div class="profile-avatar">

            N

        </div>


        <h2>
            Noir User
        </h2>


        <p class="online">
            ● Online
        </p>



        <button>
            Edit profile
        </button>


        <button>
            Privacy
        </button>


        <button>
            Settings
        </button>


    </div>




</div>





<!-- BOTTOM MENU -->


<div class="bottom-bar">


<button onclick="showScreen('chats')">

💬

<span>
Chats
</span>

</button>



<button onclick="showScreen('contacts')">

👥

<span>
Contacts
</span>

</button>



<button onclick="showScreen('profile')">

⚙️

<span>
Profile
</span>

</button>


</div>




<script src="app.js"></script>


</body>


</html>
