<!DOCTYPE html>
<html>

<head>

    <title>NoirChat</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

</head>


<body>


<div class="app">


    <!-- ЧАТЫ -->

    <div id="chats-screen">


        <header>

            <h1>
                NoirChat
            </h1>

            <button>
                +
            </button>

        </header>



        <div class="chat-list">


            <div class="chat" onclick="openChat('Alex')">


                <div class="avatar">
                    A
                </div>


                <div class="chat-text">

                    <h3>
                        Alex
                    </h3>

                    <p>
                        Welcome to NoirChat
                    </p>

                </div>


                <span class="time">
                    12:45
                </span>


            </div>





            <div class="chat" onclick="openChat('Noir Team')">


                <div class="avatar">
                    N
                </div>


                <div class="chat-text">

                    <h3>
                        Noir Team
                    </h3>

                    <p>
                        Project updates
                    </p>

                </div>


                <span class="time">
                    09:20
                </span>


            </div>



        </div>


    </div>





    <!-- ЭКРАН ЧАТА -->


    <div id="message-screen" class="hidden">


        <div class="chat-top">


    <button onclick="backToChats()">
        ←
    </button>


    <div class="user-info">


        <div class="chat-avatar">
            A
        </div>


        <div>

            <h2 id="chat-name">
                
            </h2>


            <p>
                Online
            </p>

        </div>


    </div>


</div>



        <div id="messages">


        </div>



        <div class="input-box">


            <input 
            id="message-input"
            placeholder="Message">


            <button onclick="sendMessage()">
                ➤
            </button>


        </div>


    </div>






    <!-- ПРОФИЛЬ -->


    <div id="profile-screen" class="hidden">


        <div class="profile-avatar">
            N
        </div>


        <h2>
            Noir User
        </h2>


        <p>
            ● Online
        </p>


    </div>





    <!-- КОНТАКТЫ -->


    <div id="contacts-screen" class="hidden">


        <h2>
            Contacts
        </h2>


        <div class="chat">

            <div class="avatar">
                M
            </div>


            <h3>
                Max
            </h3>

        </div>


    </div>




</div>





<!-- НИЖНЯЯ ПАНЕЛЬ -->


<nav>


<button onclick="showScreen('chats')">

💬

</button>



<button onclick="showScreen('contacts')">

👥

</button>



<button onclick="showScreen('profile')">

⚙️

</button>


</nav>



<script src="app.js"></script>


</body>

</html>
